name: Feature request
description: Propose an improvement to the library
title: "[feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the intended behavior, compatibility impact, and relevant specifications.
    validations:
      required: true
