name: Bug report
description: Report a problem in the standalone IOGO library
title: "[bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a small example using synthetic keys and certificates. Report vulnerabilities privately using the security policy.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the IOGO commit or version, go version, OS, and architecture.
    validations:
      required: true
