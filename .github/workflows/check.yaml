name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: otpki/.github/.github/workflows/reusable-go-check.yml@v1
    with:
      os-matrix: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      check-clean-tree: false
      commands: |
        just lint
        just test-ci
      vulncheck-command: just vulncheck
